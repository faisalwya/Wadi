<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Embed test</title>
<style>
body{margin:0;padding:24px 16px;background:#EFEDE8;color:#16181A;font:15px/1.5 system-ui,-apple-system,sans-serif}
h1{font-size:18px;margin:0 0 6px}
p{margin:0 0 16px;color:#5F5C55}
.box{position:relative;aspect-ratio:16/10;max-width:560px;border-radius:16px;overflow:hidden;background:#D9BCAA}
.box iframe{position:absolute;top:0;left:0;width:250%;height:250%;border:0;transform:scale(.4);transform-origin:0 0}
</style>
</head>
<body>
<h1>Live preview test: The Little Theory</h1>
<p>If the store appears in the box below, live previews work for this site. A gray box, a "refused to connect" message or an empty box means the store blocks being shown inside other sites.</p>
<div class="box"><iframe src="https://thelittletheory.com" title="The Little Theory test" loading="eager"></iframe></div>
</body>
</html>
