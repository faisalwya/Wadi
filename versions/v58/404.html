<link rel="stylesheet" href="/style.css">
<style>
  /* a quiet dead end: the small landscape, one line in each language, and the way back */
  .lost{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 16px}
  .lost h1{font-size:clamp(34px,8vw,44px)}
  .lost p{margin:0;font-size:15px;color:var(--muted);line-height:1.6}
  .lost .ar{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
  .lost a{margin-top:10px;display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
  .lost a:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:8px}
</style>
</head>
<body>
<main class="lost">
  <wadi-pattern></wadi-pattern>
  <h1>Nothing here</h1>
  <p>This path leads nowhere.</p>
  <p class="ar" lang="ar" dir="rtl">هذه الصفحة غير موجودة.</p>
  <a href="/">Back to Wadi Studio</a>
</main>
<script src="/widgets/wadi-pattern.js" defer></script>
</body>
